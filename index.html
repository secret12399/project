<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My CYOA Story</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Georgia, "Times New Roman", serif;

            background:
                radial-gradient(circle at top, #293b5f 0%, #111827 45%, #05070c 100%);

            color: #f5f1e8;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        /* Main story box */
        #story {
            width: 100%;
            max-width: 750px;

            background: rgba(15, 18, 28, 0.92);

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 18px;

            padding: 45px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(90, 120, 200, 0.08);

            backdrop-filter: blur(10px);

            animation: fadeIn 0.6s ease;
        }

        /* Small chapter label */
        .chapter {
            text-align: center;

            font-family: Arial, sans-serif;
            font-size: 13px;

            letter-spacing: 4px;
            text-transform: uppercase;

            color: #9caed0;

            margin-bottom: 12px;
        }

        /* Story title */
        #title {
            text-align: center;

            font-size: 42px;

            margin: 0 0 25px;

            color: #f8f1df;

            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.08);
        }

        /* Story text */
        #text {
            font-size: 19px;

            line-height: 1.8;

            color: #d9d9df;

            margin-bottom: 35px;

            text-align: center;
        }

        /* Choice buttons */
        #choices {
            display: flex;
            flex-direction: column;

            gap: 13px;
        }

        button {
            width: 100%;

            padding: 16px 20px;

            background: rgba(255, 255, 255, 0.04);

            color: #eee;

            border: 1px solid rgba(255, 255, 255, 0.16);

            border-radius: 10px;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 17px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        button:hover {
            background: rgba(125, 155, 220, 0.15);

            border-color: rgba(160, 185, 240, 0.6);

            transform: translateY(-2px);

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        /* Back button */
        #backButton {
            width: auto;

            padding: 10px 18px;

            margin-top: 30px;

            background: rgba(255, 255, 255, 0.03);

            color: #aaa;

            border: 1px solid rgba(255, 255, 255, 0.1);

            font-size: 14px;

            display: none;
        }

        #backButton:hover {
            color: #eee;

            background: rgba(255, 255, 255, 0.08);
        }

        /* Decorative divider */
        .divider {
            width: 80px;
            height: 1px;

            background: #7183aa;

            margin: 0 auto 30px;

            opacity: 0.7;
        }

        /* Fade animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            #story {
                padding: 30px 22px;
            }

            #title {
                font-size: 32px;
            }

            #text {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<div id="story">

    <div class="chapter" id="chapter"></div>

    <h1 id="title"></h1>

    <div class="divider"></div>

    <p id="text"></p>

    <div id="choices"></div>

    <button id="backButton" onclick="goBack()">← Back</button>

</div>

    Follow: {

    Return: {

    Hear_raccs: {

        text:
            'Coop leads you down to the lair once more. You sit at the table and the drippy raccoon introduces himself as Robert. "Hi Carm." Coop told us about you. He said you are a very kind young woman, and you showed empathy towards him. That is a rare occurrence in Switzerland. We have been persecuted for many years. Not many raccoons are left, and those that are fear for our lives every day. We only want freedom and safety. The Swiss government is about to discover us, and if that happens, we will be captured and killed. Even if we escape the country, they will hunt us down because we have hindered too many of their raccoon-hating plans. We must destroy their records. Then we can find the remaining raccoons of Switzerland, and we can all escape with our lives. All we ask of you is to infiltrate the building of the Swiss intelligence agency. We have a tour set up for a visiting Italian diplomat named Ella. They do not know her face or any details about her. They will guide her around the building and show her the capabilities of Swiss intelligence, believing that they have an opportunity to help Italian defence. This is a lie, and the reason they were eager to set up this tour. They wish only to gain access to Italian intelligence to find the raccoons we helped escape across the Italian border and find asylum. We would like you to be Ella and wear a button camera. We need only to see the building layout. Will you help us Carm?"',

    Help_raccs: {

        text:

            {

    go_thru: {

        choices:[

    see_docs: {

        choices:[

                text: 'Believe Robert',
                next: "believe"
            },

    },  

    believe: {
        chapter: "P5-1: Believe Robert",

        text:

        text:

    inq_cams: {
        chapter: "P7: Allow Search and Inquire About Cameras",

        text:

        choices:[

        text:

    share: {
        chapter: "P8: Debrief With RaccGang",

        text:
            '"The tape was seized by the guards. I instructed them to add cameras to the holding cells of the raccoons, and they reluctantly agreed and will share the feeds with me." RaccGang is disappointed to hear about the tape, but knowing that they will see their friends and get information on their substandard conditions excites them. "Robert, tell me more about that photo of you with a bomb that they showed me." The other raccoons are surprised to hear of this photo. "As I mentioned before, this was an old photo from far before the revolution. It was an edited photo used in their initial run of propaganga against raccoons. It stoked hatred against us, making me their public enemy. Following the bombing, I was hated by humans and raccoons alike. It was horrible and I felt so alone. I vowed to hack and destroy all copies of this propaganda. I worked with a few raccoons who knew me well enough to know my innocence and we managed to wipe almost every copy. After that, we dedicated our lives to fighting for the rights of raccoons. This is the origin of RaccGang, previously known only to myself and the other founders, but now to all of you."',

    cont_plot: {

        text:
            'Coop covers the next steps with you. "Ok Carm. We have two things to do. First, find another way into the safe. Second, free the prisoners. The second has to wait until we have the camera footage from that officer. As for the first, we have a few ideas. We can plant a bomb in the pneumatic ducts connected to the safe. However, we will also need to be able to activate the pneumatic system to deliver the bomb and for the safe to open for it. If the bomb detonates early or collides with any object that triggers the explosion, we will be found out and the plan is foiled. Alternatively, we can contract a squirrel we know to infiltrate the duct and steal the files. This removes the explosion risk, but we will still need to activate the pneumatics. It also runs the risk of him getting stuck inside if we can\'t activate the pneumatics again on his way out. However, this does provide much more flexibility with timing and ensuring that all documents are accounted for. We also learned that the fingerprint sensor on the safe is far more sophisticated than we thought. It checks for temperature, shape, perspiration, and faint ripples from heartbeats. If any of these are out of the ordinary, it will not work. If we want to access the safe from the door, we cannot coerce the officer. Instead, we can send in fake evidence of raccoon crimes. When it ends up being sent to the safe, we can infiltrate and capture the documents as he opens it. For this option we must be extremely precise in our timing, and strike carefully."',

    suggest_plan: {

    decline_gun: {
        chapter: "P10-2: Decline The Gun",

        text:
            'You decide that the utility of the gun is not enough to risk being caught with it as Carmela. Soon after, you receive a call from an unknown number. The voice on the other end is the officer. "Your cameras have been installed and are now running. Tomorrow at 6pm we will deliver 24 hours of recorded footage. Given the high risk of hackers, we decided to use physical film. The films are to be delivered via an armoured truck. They will have a small detonator inside, one of which is held by myself, and another by the driver of the truck. When triggered, mildly corrosive dye packs will destroy the film. Not to worry, however, as the dye will not harm you if it touches you. This is to ensure raccoons do not get a hold of this film. We will deliver the tapes to the Italian embassy, and the Italian embassy only. For security this must be the case and we absolutely will not compromise on this, although I\'m sure you don\'t mind as you diplomats spend most of your time at the embassy regardless. Once delivered, you will be given possession of the second detonator and mine will be deactivated." The officer hangs up. You and Coop recognize that you must intercept the tapes before they arrive at the embassy. Coop thinks aloud. "Ok so we have a big problem, the tapes can\'t arrive at the embassy because they won\'t know who you are. We need to steal the tapes such that they don\'t arrive at the embassy, but also make sure they aren\'t destroyed. Of these two problems, making sure your cover isn\'t exposed by delivering them to the embassy is probably the priority. But ideally we\'ll be able to do both. Option one is that we can infiltrate the back of the truck and steal the tapes, but they\'ll be destroyed by the dye. Alternatively, we can infiltrate the cab of the truck and incapacitate the drivers. However, we\'d need to make sure that they can\'t trigger the detonator or call in the attack to their base. Also, while we copy the tapes we\'d need to drive the regular route of the truck. If they see us go off track, they\'ll destroy the tapes. It\'s doable with our expertise. It\'s up to you if the information we could get is worth the risk. In addition to helping us scout out the prisoners, the tapes could change the public sentiment on raccoons."',
        choices:[ 
            {
                text: 'Take the risk',
                next: "take_risk"

let history = [];


function showScene(scene, addToHistory = true) {

    const current = story[scene];

    if (addToHistory) {
        history.push(scene);
    }

    document.getElementById("chapter").textContent =
        current.chapter;

    document.getElementById("title").textContent =
        current.title;

    document.getElementById("text").textContent =
        current.text;


    const choicesDiv =
        document.getElementById("choices");

    choicesDiv.innerHTML = "";


    current.choices.forEach(choice => {

        const button =
            document.createElement("button");

        button.textContent =
            choice.text;

        button.onclick = () => {

            showScene(choice.next);

        };

        choicesDiv.appendChild(button);

    });


    const backButton =
        document.getElementById("backButton");

    if (history.length > 1) {

        backButton.style.display = "block";

    } else {

        backButton.style.display = "none";

    }

}


function goBack() {

    if (history.length <= 1) {
        return;
    }

    history.pop();

    const previousScene =
        history[history.length - 1];

    showScene(previousScene, false);

}


showScene("start");
