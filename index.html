<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My CYOA Story</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Georgia, "Times New Roman", serif;

            background:
                radial-gradient(circle at top, #293b5f 0%, #111827 45%, #05070c 100%);

            color: #f5f1e8;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        /* Main story box */
        #story {
            width: 100%;
            max-width: 750px;

            background: rgba(15, 18, 28, 0.92);

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 18px;

            padding: 45px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(90, 120, 200, 0.08);

            backdrop-filter: blur(10px);

            animation: fadeIn 0.6s ease;
        }

        /* Small chapter label */
        .chapter {
            text-align: center;

            font-family: Arial, sans-serif;
            font-size: 13px;

            letter-spacing: 4px;
            text-transform: uppercase;

            color: #9caed0;

            margin-bottom: 12px;
        }

        /* Story title */
        #title {
            text-align: center;

            font-size: 42px;

            margin: 0 0 25px;

            color: #f8f1df;

            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.08);
        }

        /* Story text */
        #text {
            font-size: 19px;

            line-height: 1.8;

            color: #d9d9df;

            margin-bottom: 35px;

            text-align: center;
        }

        /* Choice buttons */
        #choices {
            display: flex;
            flex-direction: column;

            gap: 13px;
        }

        button {
            width: 100%;

            padding: 16px 20px;

            background: rgba(255, 255, 255, 0.04);

            color: #eee;

            border: 1px solid rgba(255, 255, 255, 0.16);

            border-radius: 10px;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 17px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        button:hover {
            background: rgba(125, 155, 220, 0.15);

            border-color: rgba(160, 185, 240, 0.6);

            transform: translateY(-2px);

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        /* Back button */
        #backButton {
            width: auto;

            padding: 10px 18px;

            margin-top: 30px;

            background: rgba(255, 255, 255, 0.03);

            color: #aaa;

            border: 1px solid rgba(255, 255, 255, 0.1);

            font-size: 14px;

            display: none;
        }

        #backButton:hover {
            color: #eee;

            background: rgba(255, 255, 255, 0.08);
        }

        /* Decorative divider */
        .divider {
            width: 80px;
            height: 1px;

            background: #7183aa;

            margin: 0 auto 30px;

            opacity: 0.7;
        }

        /* Fade animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            #story {
                padding: 30px 22px;
            }

            #title {
                font-size: 32px;
            }

            #text {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<div id="story">

    <div class="chapter" id="chapter"></div>

    <h1 id="title"></h1>

    <div class="divider"></div>

    <p id="text"></p>

    <div id="choices"></div>

    <button id="backButton" onclick="goBack()">← Back</button>

</div>


<script>

const story = {

    start: {
        chapter: "P1",
        title: "Carmy Bear's Adventure!",

        text:
            "The Carmy bear touches down in Switzerland. She is overcome by hunger after a long journey and searches for a snack. To her great dismay, she learns from a friendly raccoon that Switzerland does not have sushi and the nearest cafe, while incredible, is 3 kilometers away! She must now find an alternative because she is baby and she needs food.",

        choices: [
            {
                text: "Follow the Raccoon",
                next: "Raccoon"
            },
        ]
    },


    Raccoon: {
        chapter: "P1-2: Raccoon",

        text:
            "You slowly follow after the raccoon, keeping your distance. His eyes dart back every once in a while to see if he's being followed, but you manage to remain stealthy. A small bomb is conveniently sitting on the sidewalk.",

        choices: [
            {
                text: "Approach and speak to him",
                next: "Approach"
            }
        ]
    },

    Approach: {
        chapter: "P1-2-2: Approach",

        text:
            'You approach and ask for vaccination papers. "How racist!" he exclaims rambunctiously. However, he does pull out a paper in Swiss that seems to indicate he is not infected with rabies. You also notice a police officer working around the area.',

        choices: [
            {
                text: "Apologize for the insinuation",
                next: "Apologize"
            }
        ]
    },
    
    Apologize: {
        chapter: "P2: Apologize",

        text:
            "The raccoon hesistantly accepts your apology because you seem sincere and he introduces himself as Coop the Moop. However, he is skeptical of you. The two of you walk along and he leads you to the cafe that he mentioned earlier. The elderly owner gives you a really nice iced coffee, raspberry croissant, and tons of other pastries and snacks. She and the raccoon talk and seem to know each other. The snacks and coffee are the best you've ever had in your life. Coop dismisses himself and heads downstairs. When you try to pay the owner declines and insists it's free.",

        choices: [
            {
                text: "Follow Coop",
                next: "Follow"
            },
            {
                text: "Question the cafe owner",
                next: "Question"
            },
            {
                text: "Leave",
                next: "Leave"
            },
        ]
    },

    Follow: {
        chapter: "P2-1: Follow",

        text:
            'You excuse yourself, pretending to head to the washroom downstairs. As you reach the bottom of the stairs, you rush forward and stop a large steel door from closing all the way. After a few moments pass, you open it slightly and see Coop scurrying around a corner. Past the door lies a dim corridor lit by torches. The old marble walls are well maintained and have carvings etched in them. You slowly round the corner, ensuring nobody sees you, and reach a balcony overlooking a large roundtable covered in maps, lit by a large fire roaring in the center with the letters "RG" inscribed below. Coop sits at the table with six other raccoons.',

        choices: [
            {
                text: "Wait and listen",
                next: "Wait"
            },
            {
                text: "Make yourself known",
                next: "Appear"
            },
            {
                text: "Leave",
                next: "Leave2"
            },
        ]
    },

    Wait: {
        chapter: "P2-1-1: Wait & Listen",

        text:
            'As you eavesdrop, you hear one more raccoon approaching behind you and duck to the side to avoid being seen. He heads down and takes his seat at the table. A drippy raccoon begins to speak. "Guys, please. Please guys. We have to start. Things are going according to plan. And Coop just told me he might have a very kind and beautiful human that can help with our heist. While she did ask for rabies papers, she treated him kinder than any other young human has before. She even asked him for his advice on food options."',
        choices: [
            {
                text: "Make yourself known",
                next: ""
            },
            {
                text: "Use the bomb",
                next: ""
            },
            {
                text: "Leave",
                next: ""
            },
            {
                text: "OR: Choose your own option",
                next: ""
            },
        ]
    },

    Appear: {
        chapter: "P2-1-2: Make yourself known",

        text:
            '"Hi guys! I\'m Carm. What\'s up?" A drippy raccoon eagerly invites you down and offers you an empty seat at the table, as if expecting you. "Hi Carm I\'m Ed Garaccoon. Coop was just telling me about you. I sent him to find a kind human to help us, a hard task with all the raccoon haters in Switzerland, but he said you approached him and were kind! How miraculous! We would like to enlist your help in a heist to fight raccoon racism. Will you help us?"',
        choices: [
            {
                text: "Yes",
                next: ""
            },
            {
                text: "No",
                next: ""
            },
            {
                text: "Tell me more",
                next: ""
            },
            {
                text: "OR: Choose your own option",
                next: ""
            },
        ]
    },

    Leave2: {
        chapter: "P2-1-3: Leave",

        text:
            'As you begin moving, the raccoons hear you and run to block you. Coop kindly asks you to sit at the table with them and talk for a few minutes to hear about their plans, which they would like to involve you in. If you choose to leave, he assures you they will honour your wishes but will be very sad.',
        choices: [
            {
                text: "Sit with them",
                next: ""
            },
            {
                text: "Leave",
                next: ""
            },
            {
                text: "OR: Choose your own option",
                next: ""
            },
        ]
    },

    Question: {
        chapter: "P2-2: Question",

        text:
            'You ask the owner why she is giving you all this food for free. She tells you that Coop and his friends help to fund the cafe\'s expenses so she never charges them for anything. In her old age, she doesn\'t have the energy to work enough hours in a week to support the cafe fully by herself. After sitting for a little while longer to finish the nice iced coffee, Coop returns and asks you to come with him for a super secret mission.',
        choices: [
            {
                text: "Go with him",
                next: "Go_coop"
            },
            {
                text: "Leave",
                next: "Leave2"
            },
        ]
    },

    Go_coop: {
        chapter: "P2-2-1: Follow Coop",

        text:
            'Coop leads you down the stairs of the cafe, past a large steel door, and down a torch-lit corridor lined with marble bricks. As you descend deeper into the lair, you see a large roundtable with seven raccoons sitting. The table is covered in maps and documents, with a large fire in the center of the table illuminating them, and the letters "RH" inscribed below. A drippy raccoon eagerly invites you down and offers you an empty seat at the table. "Hi Carm I\'m Ed Garaccoon. Coop was just telling me about you. I sent him to find a kind young human to help us, a hard task with all the raccoon haters in Switzerland, but he said you approached him and were kind! How miraculous! We would like to enlist your help in a heist to fight raccoon racism. Will you help us?"',
        choices: [
            {
                text: "Yes",
                next: ""
            },
            {
                text: "No",
                next: ""
            },
            {
                text: "Tell me more",
                next: ""
            },
            {
                text: "OR: Choose your own option",
                next: ""
            },
        ]
    },

    Leave: {
        chapter: "P2-3: Leave",

        text:
            '"Carm!" Coop runs after you. He begs you to help him and explains that the raccoons of Switzerland are suffering and desperately need your help. Most other humans treat them with disgust, and at best indifference. He insists that without your help they will not only continue to suffer, but their suffering will grow exponentially.',
        choices: [
            {
                text: "Help Coop",
                next: ""
            },
            {
                text: "Leave",
                next: ""
            },
            {
                text: "OR: Choose your own option",
                next: ""
            },
        ]
    },
    
    
};


let history = [];


function showScene(scene, addToHistory = true) {

    const current = story[scene];

    if (addToHistory) {
        history.push(scene);
    }

    document.getElementById("chapter").textContent =
        current.chapter;

    document.getElementById("title").textContent =
        current.title;

    document.getElementById("text").textContent =
        current.text;


    const choicesDiv =
        document.getElementById("choices");

    choicesDiv.innerHTML = "";


    current.choices.forEach(choice => {

        const button =
            document.createElement("button");

        button.textContent =
            choice.text;

        button.onclick = () => {

            showScene(choice.next);

        };

        choicesDiv.appendChild(button);

    });


    const backButton =
        document.getElementById("backButton");

    if (history.length > 1) {

        backButton.style.display = "block";

    } else {

        backButton.style.display = "none";

    }

}


function goBack() {

    if (history.length <= 1) {
        return;
    }

    history.pop();

    const previousScene =
        history[history.length - 1];

    showScene(previousScene, false);

}


showScene("start");

</script>

</body>
</html>
