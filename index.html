<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My CYOA Story</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Georgia, "Times New Roman", serif;

            background:
                radial-gradient(circle at top, #293b5f 0%, #111827 45%, #05070c 100%);

            color: #f5f1e8;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        /* Main story box */
        #story {
            width: 100%;
            max-width: 750px;

            background: rgba(15, 18, 28, 0.92);

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 18px;

            padding: 45px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(90, 120, 200, 0.08);

            backdrop-filter: blur(10px);

            animation: fadeIn 0.6s ease;
        }

        /* Small chapter label */
        .chapter {
            text-align: center;

            font-family: Arial, sans-serif;
            font-size: 13px;

            letter-spacing: 4px;
            text-transform: uppercase;

            color: #9caed0;

            margin-bottom: 12px;
        }

        /* Story title */
        #title {
            text-align: center;

            font-size: 42px;

            margin: 0 0 25px;

            color: #f8f1df;

            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.08);
        }

        /* Story text */
        #text {
            font-size: 19px;

            line-height: 1.8;

            color: #d9d9df;

            margin-bottom: 35px;

            text-align: center;
        }

        /* Choice buttons */
        #choices {
            display: flex;
            flex-direction: column;

            gap: 13px;
        }

        button {
            width: 100%;

            padding: 16px 20px;

            background: rgba(255, 255, 255, 0.04);

            color: #eee;

            border: 1px solid rgba(255, 255, 255, 0.16);

            border-radius: 10px;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 17px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        button:hover {
            background: rgba(125, 155, 220, 0.15);

            border-color: rgba(160, 185, 240, 0.6);

            transform: translateY(-2px);

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        /* Back button */
        #backButton {
            width: auto;

            padding: 10px 18px;

            margin-top: 30px;

            background: rgba(255, 255, 255, 0.03);

            color: #aaa;

            border: 1px solid rgba(255, 255, 255, 0.1);

            font-size: 14px;

            display: none;
        }

        #backButton:hover {
            color: #eee;

            background: rgba(255, 255, 255, 0.08);
        }

        /* Decorative divider */
        .divider {
            width: 80px;
            height: 1px;

            background: #7183aa;

            margin: 0 auto 30px;

            opacity: 0.7;
        }

        /* Fade animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            #story {
                padding: 30px 22px;
            }

            #title {
                font-size: 32px;
            }

            #text {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<div id="story">

    <div class="chapter" id="chapter"></div>

    <h1 id="title"></h1>

    <div class="divider"></div>

    <p id="text"></p>

    <div id="choices"></div>

    <button id="backButton" onclick="goBack()">← Back</button>

</div>


<script>

const story = {

    start: {
        chapter: "P1",
        title: "Carmy Bear's Adventure!",

        text:
            "The Carmy bear touches down in Switzerland. She is overcome by hunger after a long journey and searches for a snack. To her great dismay, she learns from a friendly raccoon that Switzerland does not have sushi and the nearest cafe, while incredible, is 3 kilometers away! She must now find an alternative because she is baby and she needs food.",

        choices: [
            {
                text: "Follow the Raccoon",
                next: "Raccoon"
            },
        ]
    },


    Raccoon: {
        chapter: "P1-2: Raccoon",

        text:
            "You slowly follow after the raccoon, keeping your distance. His eyes dart back every once in a while to see if he's being followed, but you manage to remain stealthy. A small bomb is conveniently sitting on the sidewalk.",

        choices: [
            {
                text: "Approach and speak to him",
                next: "Approach"
            }
        ]
    },

    Approach: {
        chapter: "P1-2-2: Approach",

        text:
            'You approach and ask for vaccination papers. "How racist!" he exclaims rambunctiously. However, he does pull out a paper in Swiss that seems to indicate he is not infected with rabies. You also notice a police officer working around the area.',

        choices: [
            {
                text: "Apologize for the insinuation",
                next: "Apologize"
            }
        ]
    },
    
    Apologize: {
        chapter: "P2: Apologize",

        text:
            "The raccoon hesistantly accepts your apology because you seem sincere and he introduces himself as Coop the Moop. However, he is skeptical of you. The two of you walk along and he leads you to the cafe that he mentioned earlier. The elderly owner gives you a really nice iced coffee, raspberry croissant, and tons of other pastries and snacks. She and the raccoon talk and seem to know each other. The snacks and coffee are the best you've ever had in your life. Coop dismisses himself and heads downstairs. When you try to pay the owner declines and insists it's free.",

        choices: [
            {
                text: "Follow Coop",
                next: "Follow"
            },
        ]
    },

    Follow: {
        chapter: "P2-1: Follow",

        text:
            'You excuse yourself, pretending to head to the washroom downstairs. As you reach the bottom of the stairs, you rush forward and stop a large steel door from closing all the way. After a few moments pass, you open it slightly and see Coop scurrying around a corner. Past the door lies a dim corridor lit by torches. The old marble walls are well maintained and have carvings etched in them. You slowly round the corner, ensuring nobody sees you, and reach a balcony overlooking a large roundtable covered in maps, lit by a large fire roaring in the center with the letters "RG" inscribed below. Coop sits at the table with six other raccoons.',

        choices: [
            {
                text: "Wait and listen",
                next: "Wait"
            },
        ]
    },

    Wait: {
        chapter: "P2-1-1: Wait & Listen",

        text:
            'As you eavesdrop, you hear one more raccoon approaching behind you and duck to the side to avoid being seen. He heads down and takes his seat at the table. A drippy raccoon begins to speak. "Guys, please. Please guys. We have to start. Things are going according to plan. And Coop just told me he might have a very kind and beautiful human that can help with our heist. While she did ask for rabies papers, she treated him kinder than any other young human has before. She even asked him for his advice on food options."',
        choices: [
            {
                text: "Turn invisible and listen",
                next: "Listen"
            },
        ]
    },

    Listen: {
        chapter: "P3: Listen Invisibly",

        text:
            'You turn invisible and take a seat at the table. The raccoons hear quiet motions but they are mild enough that they all ignore them. The raccoons discuss their plans to infiltrate the Swiss Federal Intelligence Service building and destroy all records pertaining to raccoons, rabies records, and all information on their group, RaccGang, that is close to being discovered. "All the plans are ready, we just need Carm to agree to help and we can pull it off," says the drippy raccoon. Coop goes to look for you upstairs in the cafe and reveal their master plot.',
        choices: [
            {
                text: "Return to the cafe",
                next: "Return"
            }
        ]
    },

    Return: {
        chapter: "P3-1: Return to Cafe",

        text:
            'You quickly exit the chamber, remaining right behind Coop and stepping as lightly as possible. You run to get through the steel door with him before it closes, then as he steps into the cafe, you become visible and head upstairs. You see Coop looking around for you. "Hi Coop, were you looking for me?" Coop\'s face lights up. "Yes Carm! I have a proposition for you." The two of you sit at a table in the corner of the cafe, away from everyone. "I\'m a member of a group called RaccGang. In recent years Switzerland has become increasingly hostile towards raccoons. The police have been rounding up innocent raccoons, planting fake evidence of rabies, and killing us. My own brother, Boop, was arrested, beaten, and is facing death on false charges. RaccGang has been helping raccoons escape and start new lives, get rabies treatments, and veterinary records. But we\'re about to get caught. And we need your help. I can\'t speak about this any further in public. Will you come to our hideout and listen to our proposal?"',
        choices: [
            {
                text: "Hear RaccGang out",
                next: "Hear_raccs"
            },
        ]
    },

    Hear_raccs: {
        chapter: "P3-1-1: Hear Out RaccGang",

        text:
            'Coop leads you down to the lair once more. You sit at the table and the drippy raccoon introduces himself as Robert. "Hi Carm." Coop told us about you. He said you are a very kind young woman, and you showed empathy towards him. That is a rare occurrence in Switzerland. We have been persecuted for many years. Not many raccoons are left, and those that are fear for our lives every day. We only want freedom and safety. The Swiss government is about to discover us, and if that happens, we will be captured and killed. Even if we escape the country, they will hunt us down because we have hindered too many of their raccoon-hating plans. We must destroy their records. Then we can find the remaining raccoons of Switzerland, and we can all escape with our lives. All we ask of you is to infiltrate the building of the Swiss intelligence agency. We have a tour set up for a visiting Italian diplomat named Ella. They do not know her face or any details about her. They will guide her around the building and show her the capabilities of Swiss intelligence, believing that they have an opportunity to help Italian defence. This is a lie, and the reason they were eager to set up this tour. They wish only to gain access to Italian intelligence to find the raccoons we helped escape across the Italian border and find asylum. We would like you to be Ella and wear a button camera. We need only to see the building layout. Will you help us Carm?"',
        choices: [
            {
                text: '"I will help"',
                next: "Help_raccs"
            },
        ]
    },

    Help_raccs: {
        chapter: "P4: Help RaccGang",

        text:
            'You head to the building of the Swiss Federal Intelligence Service and they are ready for you. You are equipped with the button camera and a tiny earpiece with Robert\'s voice on the other end. The security stops you on the way in and instructs you to go through a metal detector. Robert tells you that this is not according to plan and they were not supposed to use the emtal detector on Ella. He is certain that the button camera is not detectable, but is unsure if the earpiece will trigger the metal detector.',
        choices:[   
            {
                text: 'Go through the metal detector',
                next: "go_thru"
            },
        ]
    },

    go_thru: {
        chapter: "P4-1: Infiltrate FIS",

        text:
            'The earpiece does not trigger the metal detector as you step through. An officer escorts you upstairs and shows you around the common areas briefly. He then takes you to an empty office and tells you to wait in there for their domestic security officer, who is currently stuck in an urgent meeting. Once he leaves, you quickly look around the room to capture everything with the button camera. Inside a cupboard is an intricate looking safe, with a password and fingerprint scan required to open it. A pneumatic tube is attached to the top, but there is no opening in the safe. As you close the cabinet and sit, the officer returns. He greets you warmly. He explains that the Swiss have developed their intelligence capabilities immensely in dealing with domestic terrorism threats, and that he can help Italy to defend themselves against domestic terror. He goes on to explain that many of the terrorists in Switzerland have fled due to police nearing in on capturing them. "All of their passports and information is stored in this safe that only I have access to. We had digital records, but the terrorists hacked into our systems and deleted everything. I still have the paper copies, so do not worry, the escapees into Italy will be identified and captured if we can reach an accord." The pneumatic system activates, and a bundle of papers is delivered to the safe. "I must open the safe, please turn around." He turns and stares at you to make sure you aren\'t looking as he inputs the code. His turn exposes the keypad, and you ensure that while your eyes are closed and head is turned, the button camera remains fixed on the safe. "Great, Carm! Now we just need his fingerprint. If you can get a piece of tape with his fingerprint we can recreate it at our hideout," says Robert.',
        choices:[
            {
                text: 'Ask to see the documents',
                next: "see_docs"
            },
        ]
    },

    see_docs: {
        chapter: "P4-1-2: Ask to See Documents",

        text:
            'The officer rubs his hands together in thought. "I am not supposed to share classified information." He finishes unlocking the safe and his face lights up. "It\'s your lucky day. The new one is special so I\'ll share it with you." He hands you a file on Robert of RaccGang. "This is a suspected terrorist mastermind. He planted a bomb in a city square, killing hundreds of humans, citing revenge against us as his motive. Now he radicalizes and misguides raccoons, recruiting them to do his bidding in the name of raccoon rights." The officer shows you a photo of Robert with a bomb in the city square.',
        choices:[
            {
                text: 'Hear out Robert\'s side of the story',
                next: "hear_rob"
            },
        ]
    },
    
    hear_rob: {
        chapter: "P5: Hear Out Robert",

        text:
            'Robert tells you that the photo is doctored. It is a piece of propaganda that has been used to frame the raccoons for a bombing that the Swiss Intelligence set up. It is from long before RaccGang or the revolution ever even existed.',
        choices:[
            {
                text: 'Believe Robert',
                next: "believe"
            },
            {
                text: 'Don\'t Believe Robert',
                next: "dont_believe"
            },   
        ]
    },  

    believe: {
        chapter: "P5-1: Believe Robert",

        text:
            'The officer puts away the documents and locks the safe. As the both of you leave for the remainder of your tour, you purposefully leave your bag behind. When you run back in to grab it, you take a piece of tape from the officer\'s desk and get the fingerprint from the safe. Hearing a lot of movement, the officer opens the door, only to see you picking up your bag and heading out. He shows you more of the offices, and during the final stop he takes you underground to their holding cells. As you descend, the earpiece and camera feed to Robert are lost. The officer leads you down a murky passage leading to an enormous vault door. He enters a tiny sealed capsule and types in a password and gives a face scan. He then converses with another person who provides access once seeing that he is alone in the capsule and has given his authorization to open the vault. The door opens, revealing dozens of raccoons behind bars, looking malnourished and weak. "These are the terrorists that Italy will not have to deal with because of our efforts. They will never escape from here." Given the advanced security measures, you realize this may be your only chance to save the captive raccoons.',
        choices:[
            {
                text: 'Knock Out The Officer',
                next: ""
            },
            {
                text: 'Do Nothing',
                next: ""
            },   
            {
                text: 'OR: Choose your own solution. The raccoons need you.',
                next: ""
            },  
        ]
    }, 

    believe: {
        chapter: "P5-2: Don\'t Believe Robert",

        text:
            'You see through Robert\'s lies, knowing that the Swiss Intelligence would not include manipulated and publicly available propaganda in their secure files. "Tell me more," you ask. The officer goes on to explain that the photo has been erased from every online database they have, and the only existing copy is the original in his hands, which Robert has been trying to steal and destroy for years, almost succeeding in his most recent heist attempt. It is the most important piece of evidence that will stand against him in court.',
        choices:[
            {
                text: 'Leave And Deal With The Situation Privately',
                next: ""
            },
            {
                text: 'Expose Robert',
                next: ""
            },
            {
                text: 'Expose Robert and RaccGang',
                next: ""
            },   
            {
                text: 'OR: Choose your own option',
                next: ""
            },  
        ]
    }, 
};


let history = [];


function showScene(scene, addToHistory = true) {

    const current = story[scene];

    if (addToHistory) {
        history.push(scene);
    }

    document.getElementById("chapter").textContent =
        current.chapter;

    document.getElementById("title").textContent =
        current.title;

    document.getElementById("text").textContent =
        current.text;


    const choicesDiv =
        document.getElementById("choices");

    choicesDiv.innerHTML = "";


    current.choices.forEach(choice => {

        const button =
            document.createElement("button");

        button.textContent =
            choice.text;

        button.onclick = () => {

            showScene(choice.next);

        };

        choicesDiv.appendChild(button);

    });


    const backButton =
        document.getElementById("backButton");

    if (history.length > 1) {

        backButton.style.display = "block";

    } else {

        backButton.style.display = "none";

    }

}


function goBack() {

    if (history.length <= 1) {
        return;
    }

    history.pop();

    const previousScene =
        history[history.length - 1];

    showScene(previousScene, false);

}


showScene("start");

</script>

</body>
</html>
